<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Robofest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root {
    --bg:#f3f5f9; --card:#fff; --soft:#f6f7fa; --line:#e6e9f0; --text:#1b2030; --muted:#8a93a6;
    --primary:#3454d1; --primary-soft:#e8edfd;
    --green:#16a34a; --green-soft:#e3f6ea; --orange:#e08a00; --orange-soft:#fff1d6;
    --red:#dc2626; --red-soft:#fde8e8; --gray-soft:#eceef3;
    --r:14px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 "Pretendard","Malgun Gothic","Segoe UI",sans-serif; overflow:hidden; }
  button, select, input { font:inherit; color:inherit; }
  svg { flex:none; }
  .app { display:flex; gap:16px; height:100%; padding:16px; }
  .card { background:var(--card); border-radius:var(--r); }

  /* ---- 사이드바 ---- */
  aside { width:232px; display:flex; flex-direction:column; gap:12px; transition:width .15s; }
  .logo { height:48px; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--primary); font-size:16px; }
  .iconbtn { width:44px; height:44px; border:0; display:grid; place-items:center; cursor:pointer; color:var(--primary); }
  .iconbtn:hover { background:var(--primary-soft); }
  nav { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; border:0; background:none; cursor:pointer;
              color:#5b6478; text-align:left; font-weight:500; white-space:nowrap; position:relative; }
  .nav-item:hover { background:var(--soft); }
  .nav-item.active { background:var(--primary-soft); color:var(--primary); font-weight:600; }
  .nav-dot { position:absolute; right:12px; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:var(--red); display:none; }
  .nav-item.alert .nav-dot { display:block; }
  .collapsed aside { width:68px; }
  .collapsed .logo { font-size:0; }
  .collapsed .logo::before { content:"●"; font-size:14px; }
  .collapsed .nav-item { justify-content:center; padding:11px 0; }
  .collapsed .nav-item span { display:none; }

  /* ---- 본문 ---- */
  main { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
  .top { height:48px; padding:0 16px 0 20px; display:flex; align-items:center; justify-content:space-between; }
  .top h1 { margin:0; font-size:16px; font-weight:700; }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
  .content { flex:1; min-height:0; padding:20px; overflow-y:auto; position:relative; }
  .page { display:none; flex-direction:column; gap:16px; min-height:100%; }
  .page.active { display:flex; }
  .page.fill { height:100%; min-height:0; }

  h3 { margin:0; font-size:14px; font-weight:700; }
  .sub { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .muted { color:var(--muted); font-size:12px; }
  .panel { border:1px solid var(--line); border-radius:12px; padding:16px; background:#fff; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .grow { flex:1; }

  /* 배지 */
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .b-green { background:var(--green-soft); color:var(--green); }
  .b-orange { background:var(--orange-soft); color:var(--orange); }
  .b-red { background:var(--red-soft); color:var(--red); }
  .b-gray { background:var(--gray-soft); color:#667085; }

  /* 배너 */
  .banner { display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px; font-size:13px; }
  .banner.red { background:var(--red-soft); color:var(--red); border:1px solid #f9c9c9; }
  .banner.orange { background:var(--orange-soft); color:#a76300; border:1px solid #f6d99a; }
  .banner.green { background:var(--green-soft); color:var(--green); border:1px solid #bfe8cd; }
  .banner.blue { background:var(--primary-soft); color:var(--primary); border:1px solid #cdd8fa; }

  /* 수신기 바 */
  .recv { display:flex; flex-direction:column; gap:10px; }
  .recv-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 14px; border:1px solid var(--line); border-radius:12px; }
  .recv-name { font-weight:700; display:flex; align-items:center; gap:8px; }
  .ctl { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  select, input[type=text] { height:32px; border:1px solid var(--line); border-radius:8px; padding:0 8px; background:#fff; min-width:0; }
  select:focus, input:focus { outline:2px solid #c7d3fb; border-color:var(--primary); }
  .btn { height:32px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:600; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:#2a46b8; color:#fff; }
  .btn.outline { border-color:var(--primary); color:var(--primary); }
  .btn.danger { color:var(--red); }
  .btn.lg { height:38px; padding:0 18px; }
  .hint { font-size:11px; color:var(--muted); text-align:right; }

  /* 로봇 카드 */
  .robots { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  .robot { background:var(--soft); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; position:relative; }
  .robot .head { display:flex; align-items:center; gap:10px; }
  .thumb { width:38px; height:38px; border-radius:10px; background:#dfe3ec; color:#5b6478; display:grid; place-items:center; flex:none; }
  .robot .name { font-weight:700; }
  .robot .foot { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; align-items:center; }
  .robot .foot .b { display:flex; align-items:center; gap:4px; }
  .robot .del { position:absolute; right:10px; bottom:8px; opacity:0; border:0; background:none; color:var(--red); cursor:pointer; padding:4px; }
  .robot:hover .del { opacity:1; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:28px 0; color:var(--muted); font-size:12px; text-align:center; }

  /* 표 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:9px 10px; border-bottom:1px solid #f0f2f6; }
  td.num { font-variant-numeric:tabular-nums; }

  /* 배터리 */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat { border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .stat .k { color:var(--muted); font-size:12px; }
  .stat .v { font-size:20px; font-weight:700; margin-top:2px; }
  .bat { display:grid; grid-template-columns:200px 1fr 220px; align-items:center; gap:20px; border:1px solid var(--line); border-radius:12px; padding:16px 20px; }
  .bat .pct { display:flex; align-items:center; gap:8px; font-size:26px; font-weight:800; }
  .bar { height:8px; border-radius:6px; background:var(--gray-soft); overflow:hidden; margin:8px 0 6px; }
  .bar > i { display:block; height:100%; border-radius:6px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:12px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .kv span:nth-child(even) { text-align:right; font-weight:600; }
  .c-green { color:var(--green); } .c-orange { color:var(--orange); } .c-red { color:var(--red); } .c-gray { color:#98a2b3; }
  .f-green { background:var(--green); } .f-orange { background:#f59e0b; } .f-red { background:var(--red); }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  #batChart { width:100%; height:190px; display:block; }

  /* 카메라 */
  .tabs { display:flex; gap:6px; }
  .tab { border:0; background:var(--soft); padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:600; color:#5b6478; }
  .tab.active { background:var(--primary-soft); color:var(--primary); }
  .cam-grid { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  .video { position:relative; aspect-ratio:4/3; max-height:56vh; width:100%; background:#10131a; border-radius:12px; overflow:hidden; display:grid; place-items:center; }
  .video video, .video canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .video .tag { position:absolute; top:10px; padding:2px 9px; border-radius:6px; font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); z-index:2; }
  .video .tag.l { left:10px; } .video .tag.r { right:10px; }
  .video .tag.live { background:#e11d48; } .video .tag.off { background:#475467; } .video .tag.rec { background:#e11d48; animation:blink 1s infinite; }
  .video .off-msg { position:relative; z-index:1; color:#c4cad6; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .video.fall { outline:3px solid var(--red); }
  @keyframes blink { 50% { opacity:.55; } }
  .controls { display:flex; align-items:center; gap:8px; padding:10px 4px 0; }
  .cbtn { width:34px; height:34px; border-radius:8px; border:0; background:var(--soft); cursor:pointer; display:grid; place-items:center; color:#475467; }
  .cbtn:hover:not(:disabled) { background:var(--primary-soft); color:var(--primary); }
  .cbtn:disabled { opacity:.4; cursor:not-allowed; }
  .cbtn.rec { color:var(--red); }
  .caps { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .caps img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; cursor:pointer; display:block; }

  /* 지도 */
  .mapwrap { position:relative; flex:1; min-height:320px; border-radius:12px; overflow:hidden; background:#10131a; }
  #mapview { position:absolute; inset:0; }
  #mapview canvas { display:block; }
  .overlay { position:absolute; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:12px; padding:10px 14px; z-index:3; }
  #mapTL { left:12px; top:12px; display:flex; flex-direction:column; gap:8px; max-width:260px; }
  #mapHud { right:12px; top:12px; line-height:1.7; min-width:170px; font-variant-numeric:tabular-nums; font-size:13px; }
  #mapHud b { color:var(--primary); }
  #miniMap { position:absolute; right:12px; bottom:12px; width:200px; height:200px; border-radius:12px; border:1px solid var(--line); z-index:3; }
  #mapSettings { left:12px; bottom:12px; width:270px; display:none; flex-direction:column; gap:8px; max-height:70%; overflow:auto; }
  #mapSettings.open { display:flex; }
  .fld { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  .fld input { height:30px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #fallBanner { position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:4; display:none; background:#e11d48; color:#fff; font-weight:700; padding:9px 20px; border-radius:10px; box-shadow:0 6px 24px rgba(225,29,72,.4); animation:blink 1s infinite; }
  #fallBanner.show { display:block; }
  .mapmsg { position:absolute; inset:0; display:grid; place-items:center; color:#c4cad6; z-index:2; text-align:center; padding:20px; }

  /* 로봇등록 */
  .form { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  .form label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); font-weight:500; }
  .form label b { color:var(--red); }
  .form input { height:38px; font-size:13px; color:var(--text); }
  .model { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; background:var(--soft); }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid #c7d3fb; border-top-color:var(--primary); animation:spin .8s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 중앙 오류 팝업 */
  #commErr { position:fixed; inset:0; background:rgba(16,19,26,.45); display:none; place-items:center; z-index:50; }
  #commErr.show { display:grid; }
  #commErr .box { background:#fff; border-radius:16px; padding:28px 36px; text-align:center; min-width:340px; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.3); border-top:5px solid var(--red); }
  #commErr .ico { width:52px; height:52px; border-radius:50%; background:var(--red-soft); color:var(--red); display:grid; place-items:center; margin:0 auto 12px; }
  #ceTitle { font-size:20px; font-weight:800; color:var(--red); }
  #ceDetail { color:#475467; margin:6px 0 18px; }
  @media (max-width:1100px) {
    .bat { grid-template-columns:1fr; gap:10px; }
    .cam-grid { grid-template-columns:1fr; }
    .robots { grid-template-columns:1fr; }
    .form { grid-template-columns:1fr; }
    .content { padding:14px; }
  }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#d5d9e3; border-radius:8px; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="logo card">로고 이름</div>
    <button class="iconbtn card" id="burger" title="메뉴 접기/펼치기"></button>
    <nav class="card" id="nav"></nav>
  </aside>
  <main>
    <header class="top card"><h1 id="title"></h1><div class="avatar" id="avatar"></div></header>
    <div class="content card" id="content"></div>
  </main>
</div>

<div id="commErr"><div class="box">
  <div class="ico" id="ceIco"></div>
  <div id="ceTitle">통신 끊김</div>
  <div id="ceDetail"></div>
  <button class="btn primary lg" id="ceClose">확인</button>
</div></div>

<script>
// ====================================================================== 공통 유틸
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const store = { get:(k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set:(k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const setHTML = (el, html) => { if (el && el._h !== html) { el.innerHTML = html; el._h = html; } };

const ICON = {
  menu:'<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
  battery:'<rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/>',
  wifi:'<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  cameraOff:'<path d="M2 2l20 20"/><path d="M7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 1.4-.6"/><path d="M9.5 4h5L17 7h3a2 2 0 0 1 2 2v7.5"/><path d="M14.1 14.1a3 3 0 0 1-4.2-4.2"/>',
  map:'<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/>',
  bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  rec:'<circle cx="12" cy="12" r="6" fill="currentColor"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>',
  full:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
};
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const PAGES = [
  { id:'battery', label:'배터리', icon:'battery' },
  { id:'comm',    label:'통신상태', icon:'wifi' },
  { id:'camera',  label:'카메라', icon:'camera' },
  { id:'map',     label:'지도', icon:'map' },
  { id:'reg',     label:'로봇등록', icon:'bot' },
];
const NODATA_AFTER = 5;     // 초: 수신기는 연결됐지만 이 시간 동안 유효 데이터가 없으면 "데이터 없음"
const COMM_TIMEOUT = 3;     // 초: 데이터를 받다가 이 시간 이상 끊기면 중앙에 오류 팝업
const COLORS = ['#3454d1', '#e11d48', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4'];

let S = null;               // 최신 상태 (파이썬 get_state)
let page = store.get('page', 'comm');
if (!PAGES.some(p => p.id === page)) page = 'comm';

const rxStatus = () => {
  if (!S) return 'off';
  if (S.rx.state === 'error') return 'error';
  if (S.rx.state !== 'connected') return 'off';
  return (S.rx.age === null || S.rx.age > NODATA_AFTER) ? 'nodata' : 'ok';
};
const ago = a => a === null || a === undefined ? null : a < 1.5 ? '방금' : a < 60 ? `${Math.round(a)}초 전` : `${Math.floor(a / 60)}분 전`;
const robotColor = sn => COLORS[Math.max(0, (S?.robots ?? []).findIndex(r => r.serial === sn)) % COLORS.length];

function robotStatus(r) {
  const rs = rxStatus();
  if (rs === 'off' || rs === 'error') return { t:'수신기 연결 끊김', c:'gray' };
  if (r.age !== null && r.age < 3) return { t:'수신 중', c:'green' };

// ====================================================================== 배터리
function estLeft(r) {                        // 최근 기록의 감소 속도로 남은 시간 추정
  const h = r.hist.filter(p => p[0] > S.now - 1800);
  if (h.length < 3 || r.battery === null) return '--';
  const dt = (h[h.length - 1][0] - h[0][0]) / 3600, dp = h[0][1] - h[h.length - 1][1];
  if (dt < 0.01 || dp <= 0.05) return '--';
  const hrs = r.battery / (dp / dt);
  return hrs > 99 ? '99시간 이상' : hrs < 1 ? `약 ${Math.round(hrs * 60)}분` : `약 ${Math.floor(hrs)}시간 ${Math.round((hrs % 1) * 60)}분`;
}
function renderBattery() {
  const R = S.robots, vals = R.filter(r => r.battery !== null);
  const low = R.filter(r => r.battery !== null && r.battery < 20);
  const avg = vals.length ? vals.reduce((a, r) => a + r.battery, 0) / vals.length : null;
  setHTML($('#batStats'), `<div class="stat"><div class="k">등록된 로봇</div><div class="v">${R.length}대</div></div>
    <div class="stat"><div class="k">경고 로봇</div><div class="v ${low.length ? 'c-red' : ''}">${vals.length ? low.length + '대' : '--'}</div></div>
    <div class="stat"><div class="k">평균 배터리</div><div class="v">${avg === null ? '--%' : (Math.round(avg * 10) / 10) + '%'}</div></div>`);
  setHTML($('#batBanner'), low.length ? `<div class="banner red">${ic('alert', 16)} ${low.map(r => `${esc(r.name)} 배터리가 ${Math.round(r.battery)}%로 부족합니다.`).join(' ')} 충전해주세요.</div>`
    : R.length && !vals.length ? `<div class="banner orange">${ic('alert', 16)} 로봇 배터리 정보를 수신하지 못해 상태를 확인할 수 없습니다.</div>` : '');
  setHTML($('#batList'), R.length ? R.map(r => {
    const c = battClass(r.battery), p = r.battery, st = robotStatus(r);
    return `<div class="bat"><div class="head" style="display:flex;gap:10px;align-items:center"><div class="thumb">${ic('bot', 20)}</div>
      <div><div style="font-weight:700">${esc(r.name)}</div><div class="muted">${esc(r.model)} · ${esc(r.serial)}</div></div></div>
      <div><div class="pct c-${c}">${ic('battery', 20)} ${p === null ? '--%' : Math.round(p) + '%'}</div>
        <div class="bar"><i class="f-${c === 'gray' ? 'orange' : c}" style="width:${p ?? 0}%"></i></div>
        <div class="muted">${r.age === null ? '수신 기록 없음' : '마지막 수신 ' + ago(r.age)}</div></div>
      <div class="kv"><span>전압</span><span>${r.voltage === null ? '--' : r.voltage.toFixed(1) + ' V'}</span>
        <span>상태</span><span>${st.c === 'green' ? (r.moving ? '주행 중' : '정지') : '--'}</span>
        <span>예상 사용 시간</span><span>${estLeft(r)}</span></div></div>`;
  }).join('') : `<div class="empty">${ic('battery', 28)}등록된 로봇이 없습니다.</div>`);
  drawBatteryChart();
}
function drawBatteryChart() {
  const cv = $('#batChart'), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const L = 34, B = 20, T = 6, w = W - L - 20, h = H - B - T, t1 = S.now, t0 = t1 - 3600;
  g.font = '11px sans-serif'; g.fillStyle = '#8a93a6'; g.strokeStyle = '#eef0f5'; g.lineWidth = 1;
  [0, 50, 100].forEach(v => { const y = T + h * (1 - v / 100); g.beginPath(); g.moveTo(L, y); g.lineTo(W - 8, y); g.stroke(); g.textAlign = 'right'; g.fillText(v + '%', L - 6, y + 4); });
  g.textAlign = 'center';
  for (let i = 0; i <= 4; i++) { const t = new Date((t0 + i * 900) * 1000); g.fillText(`${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`, L + w * i / 4, H - 4); }
  let any = false;
  S.robots.forEach((r, i) => {
    const pts = r.hist.filter(p => p[0] >= t0);
    if (pts.length < 2) return; any = true;
    g.strokeStyle = COLORS[i % COLORS.length]; g.lineWidth = 2; g.beginPath();
    pts.forEach((p, k) => { const x = L + w * (p[0] - t0) / 3600, y = T + h * (1 - p[1] / 100); k ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  });
  if (!any) { g.fillStyle = '#98a2b3'; g.textAlign = 'center'; g.fillText('표시할 데이터가 없습니다.', L + w / 2, T + h / 2); }
  setHTML($('#batLegend'), S.robots.map((r, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${esc(r.name)}</span>`).join(''));
}

const reg = { state:'idle', msg:'' };       // idle | testing | success | fail | done
const F = { model:$('#fModel'), serial:$('#fSerial'), name:$('#fName'), memo:$('#fMemo') };
const regReady = () => F.model.value.trim() && F.serial.value.trim() && F.name.value.trim();

  reg.state = 'done'; reg.msg = `‘${F.name.value.trim()}’ 로봇이 등록되었습니다.`;
  Object.values(F).forEach(el => el.value = '');

function renderReg() {
  if (!S) return;
  setHTML($('#regRobots'), robotCards(true));
  $('#regCount').textContent = `(${S.robots.length})`;
  const rs = rxStatus(), connected = rs === 'ok' || rs === 'nodata';
  if (reg.state === 'testing' && S.test && S.test.serial.toLowerCase() === F.serial.value.trim().toLowerCase()) {
    if (S.test.state === 'ok') { reg.state = 'success'; reg.msg = ''; }
    else if (S.test.state === 'fail') { reg.state = 'fail'; reg.msg = '응답이 없습니다. 로봇 전원, 시리얼번호, 채널을 확인한 뒤 다시 시도하세요.'; }
  }
  const ready = !!regReady();
  $('#btnTest').disabled = !(connected && ready) || reg.state === 'testing';
  $('#btnTest').textContent = reg.state === 'testing' ? '연결 테스트 중...' : reg.state === 'fail' ? '다시 테스트' : '연결 테스트';

const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
let loadingModel = false;
async function loadModel() {

function analyzePose(lm, aspect) {    // 몸통이 수평에 가깝고 몸 전체가 가로로 넓으면 쓰러짐

  if (![11, 12, 23, 24].every(오케이)) return { fallen:false };
  const sh = { x:(lm[11].x + lm[12].x) / 2, y:(lm[11].y + lm[12].y) / 2 }, hp = { x:(lm[23].x + lm[24].x) / 2, y:(lm[23].y + lm[24].y) / 2 };
  const tilt = Math.atan2(Math.abs(sh.x - hp.x) * aspect, Math.abs(sh.y - hp.y)) * 180 / Math.PI;
  const pts = lm.filter((_, i) => ok(i));

  const res = cam.landmarker.detectForVideo(v, performance.now());
  let any = false;
  for (const lm of res.landmarks) {
    const r = analyzePose(lm, v.videoWidth / v.videoHeight);
    if (r.box) { ctx.strokeStyle = r.fallen ? '#ff3355' : '#4cc9f0'; ctx.lineWidth = 4; ctx.strokeRect(r.box[0] * c.width, r.box[1] * c.height, r.box[2] * c.width, r.box[3] * c.height); }
    any ||= r.fallen;
  }
  if (any) { cam.hit++; cam.miss = 0; } else if (++cam.miss >= 12) cam.hit = 0;

  if (t && $('#follow').checked) {                    // 3인칭 추적: 로봇 뒤 위쪽
    _fwd.set(Math.cos(t.pose.th), 0, -Math.sin(t.pose.th));
    _want.copy(t.g.position).addScaledVector(_fwd, -1.1); _want.y += 0.6;
    M.camera.position.lerp(_want, 0.08);
    _look.copy(t.g.position).addScaledVector(_fwd, 0.4); _look.y = 0.05;
    M.camera.lookAt(_look); M.controls.target.copy(_look);
  } else M.controls.update();
  M.renderer.render(M.scene, M.camera);
  drawMini();
  $('#fallBanner').classList.toggle('show', M.falls.some(f => performance.now() - f.t < 8000));
}

function drawMini() {
  const W = mini.width, H = mini.height, pad = 18, bots = Object.values(M.robots);
  let x0 = 0, x1 = 0, y0 = 0, y1 = 0;
  const ext = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
  bots.forEach(b => { ext(b.pose.x, b.pose.y); for (let i = 0; i < b.n; i++) ext(b.pos[i * 3], -b.pos[i * 3 + 2]); });
  M.falls.forEach(f => ext(f.x, f.y));
  const span = Math.max(x1 - x0, y1 - y0, 1), s = (W - pad * 2) / span, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const sx = x => W / 2 + (x - cx) * s, sy = y => H / 2 - (y - cy) * s;
  mctx.clearRect(0, 0, W, H); mctx.fillStyle = 'rgba(255,255,255,.95)'; mctx.fillRect(0, 0, W, H);
  const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(m => m * mag).find(v => v >= raw);
  mctx.strokeStyle = '#e6e9f0'; mctx.lineWidth = 1; mctx.beginPath();
  for (let gx = Math.ceil((cx - W / s) / step) * step; gx < cx + W / s; gx += step) { mctx.moveTo(sx(gx), 0); mctx.lineTo(sx(gx), H); }
  for (let gy = Math.ceil((cy - H / s) / step) * step; gy < cy + H / s; gy += step) { mctx.moveTo(0, sy(gy)); mctx.lineTo(W, sy(gy)); }
  mctx.stroke();
  bots.forEach((b, i) => {
    const col = robotColor(Object.keys(M.robots)[i]);
    if (b.n > 1) { mctx.strokeStyle = col; mctx.lineWidth = 2; mctx.beginPath(); for (let k = 0; k < b.n; k++) { const x = sx(b.pos[k * 3]), y = sy(-b.pos[k * 3 + 2]); k ? mctx.lineTo(x, y) : mctx.moveTo(x, y); } mctx.stroke(); }
    mctx.save(); mctx.translate(sx(b.pose.x), sy(b.pose.y)); mctx.rotate(-b.pose.th); mctx.fillStyle = col;
    mctx.beginPath(); mctx.moveTo(9, 0); mctx.lineTo(-6, 6); mctx.lineTo(-6, -6); mctx.closePath(); mctx.fill(); mctx.restore();
  });
  mctx.fillStyle = '#98a2b3'; mctx.beginPath(); mctx.arc(sx(0), sy(0), 3, 0, 7); mctx.fill();
  M.falls.forEach(f => { const x = sx(f.x), y = sy(f.y); mctx.strokeStyle = '#e11d48'; mctx.fillStyle = 'rgba(225,29,72,.25)'; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(x, y, 8, 0, 7); mctx.fill(); mctx.stroke(); mctx.fillStyle = '#e11d48'; mctx.font = 'bold 11px sans-serif'; mctx.textAlign = 'center'; mctx.fillText('!', x, y + 4); mctx.textAlign = 'left'; });
  mctx.fillStyle = '#8a93a6'; mctx.font = '11px sans-serif'; mctx.fillText(`격자 ${step} m`, 8, H - 8);
}

// 지도 화면 컨트롤
$('#mapSel').onchange = e => { M.sel = e.target.value; };
$('#mapSetBtn').onclick = () => {
  const o = $('#mapSettings'); o.classList.toggle('open');
  if (o.classList.contains('open') && S) { $('#pTpr').value = S.params.tpr; $('#pDia').value = S.params.dia; $('#pBase').value = S.params.base; }
};
['#pTpr', '#pDia', '#pBase'].forEach(id => $(id).onchange = () => pywebview.api.set_params($('#pTpr').value, $('#pDia').value, $('#pBase').value));
$('#clearTrail').onclick = () => { Object.values(M.robots).forEach(clearTrail); M.falls.forEach(f => M.scene?.remove(f.g)); M.falls.length = 0; };
$('#mAdd').onclick = () => pywebview.api.inject(M.sel, $('#mL').value, $('#mR').value, true);
$('#mSet').onclick = () => pywebview.api.inject(M.sel, $('#mL').value, $('#mR').value, false);
$('#mReset').onclick = () => pywebview.api.reset_pose(M.sel);

// ====================================================================== 시작
window.addEventListener('pywebviewready', async () => {
  await refreshPorts();
  go(page);
  poll();
});
go(page);
</script>
